[package]
name = "unblinking"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
fastrand = "2.5.0"
image = { version = "0.25", default-features = false }
nokhwa = { version = "0.10.11", features = ["input-native"] }
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tract-onnx = "0.23.9"
tray-icon = "0.26.1"
wgpu = { version = "30.0.1", features = ["glsl"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

[profile.release]
# Smaller, faster exe: whole-program optimisation and no debug symbols.
lto = true
codegen-units = 1
strip = true

