[package]
name = "unblinking"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fastrand = "2.5.0"
png = "0.18.1"
pollster = "1.0.1"
wgpu = { version = "30.0.1", features = ["glsl"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

[profile.release]
# Smaller, faster exe: whole-program optimisation and no debug symbols.
lto = true
codegen-units = 1
strip = true

